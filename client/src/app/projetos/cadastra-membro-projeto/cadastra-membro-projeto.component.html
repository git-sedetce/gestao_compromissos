<section id="formProject">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="card card_form mt-5">
          <div class="cabecalho">
            <h3 class="pb-3 pt-3 text-center text-white text-uppercase">Cadastro de Membros</h3>
          </div>
          <form class="ms-4 me-4" #formMember="ngForm">
            <fieldset>
              <legend>
                Membros para o Projeto: {{ projeto.name }}
              </legend>

              <div class="row mt-4 mb-4">
              </div>
              <div class="row mt-4 mb-4">
                <div class="form-floating col-sm-6 col-12">
                  <select name="user_id" id="user_id" class="form-select" [(ngModel)]="membro.user_id"
                    #user_id="ngModel" (change)="(getNomeMembro(user_id.value))">
                    <option *ngFor="let membro of lista_membro" [value]="membro.id">{{ membro.name }}</option>
                  </select>
                  <label class="form-label pergunta ms-3" for="user_id">Cadastro de Membros</label>
                </div>

                <div class="form-group col-sm-6 col-12 mb-3">
                  <div class="form-floating">
                    <select name="responsabilidade_id" id="responsabilidade_id" class="form-select"
                      [(ngModel)]="membro.responsabilidade_id" #responsabilidade_id="ngModel"
                      (change)="(getResponsabilidade(responsabilidade_id.value))">
                      <option *ngFor="let nivel of lista_resp" [value]="nivel.id">{{ nivel.tipo_responsabilidade }}
                      </option>
                    </select>
                    <label class="form-label pergunta ms-3" for="responsabilidade_id">Nível de Responsabilidade</label>
                  </div>
                </div>
              </div>

              <!-- Botão para Adicionar Membro -->
              <button class="btn btn-info btn-block mb-2" [disabled]="!formMember.valid"
                (click)="adicionarMembro()">Adicionar Membro</button>
              <br>
              <br>
              <div *ngIf="membrosAdicionados.length > 0">
                <h3 class="text-center mt-2 mb-3">Membros Adicionados</h3>
                <table class="table table-striped table-hover mb3">
                  <thead>
                    <tr>
                      <th scope="col" class="align-middle text-center">Nome do Projeto</th>
                      <th scope="col" class="align-middle text-center">Nome do Membro</th>
                      <th scope="col" class="align-middle text-center">Nível de Responsabilidade</th>
                      <th scope="col" class="align-middle text-center">Remover Membro</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let membro of membrosAdicionados">
                      <td class="align-middle text-center">{{ membro.nome_projeto }}</td>
                      <td class="align-middle text-center">{{ membro.nome_membro }}</td>
                      <td class="align-middle text-center">{{ membro.responsabilidade }}</td>
                      <td class="align-middle text-center bg-danger text-white" (click)="removerMembro(membro.user_id)"><i class="bi bi-trash-fill"></i></td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <button *ngIf="membrosAdicionados.length > 0" class="btn btn-primary btn-block mt-3 mb-4" type="submit" (click)="cadastraMembro()">Cadastro de Membro</button>
            </fieldset>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
