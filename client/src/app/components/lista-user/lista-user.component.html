<section>
  <div class="container">
    <div class="text-dark mt-3 cabecalho">
      <h3 class="pb-3 pt-3 text-center text-white text-uppercase">
        Usuários
      </h3>
    </div>

    <!-- <div class="row">

      <div class="col-sm-2 col-12 mb-2">
        <div class="filter-nav d-flex flex-center">
          <button class="mx-3 mt-1 pt-1 pb-1 btn btn-primary text-uppercase fw-bold" (click)="getEventos()">Lista de Eventos</button>
        </div>
      </div>
    </div> -->


    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th scope="col" class="align-middle text-center">Nome Completo</th>
          <th scope="col" class="align-middle text-center">Email</th>
          <th scope="col" class="align-middle text-center">Usuário Ativo?</th>
          <th scope="col" class="align-middle text-center">Coordenadoria</th>
          <th scope="col" class="align-middle text-center">Secretaria Executiva</th>
          <th scope="col" colspan="2" class="align-middle text-center">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of lista_users | paginate: { itemsPerPage: itemsPerPage, currentPage: page }">
          <td class="align-middle">{{ user.name }}</td>
          <td class="align-middle text-center">{{ user.user_email }}</td>
          <td class="align-middle text-center"><i class="bi bi-hand-thumbs-up-fill btn btn-success" *ngIf="user.user_active == true"></i><i class="bi bi-hand-thumbs-down-fill btn btn-danger" *ngIf="user.user_active == false"></i></td>
          <td class="align-middle text-center">{{ user.ass_users_coord.sigla }}</td>
          <td class="align-middle text-center">{{ user.ass_users_sexec.sigla }}</td>
          <td class="align-middle text-center"><button (click)="onEdit(user)" type="button" class="btn btn-warning mx-3" data-bs-toggle="modal" data-bs-target="#modalEdit"><i class="bi bi-pencil-square"></i></button></td>
          <td class="align-middle text-center"><button (click)="deletaUser(user)" type="button" class="btn btn-danger mx-3"><i class="bi bi-trash-fill"></i></button></td>
        </tr>
      </tbody>
    </table>
    <pagination-controls class="text-center" (pageChange)="page = $event"></pagination-controls>
  </div>

</section>

<!-- Modal -->
 <div class="modal fade" id="modalEdit" tabindex="-1" aria-labelledby="modalEditLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable mt-5">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalEditLabel">Editar Usuário</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup] = "formUser">

          <div class="row mt-4 mb-4">

            <div class="form-group col-sm-4 col-12 ">
              <div class="form-floating">
                <input type="text" id="name" name="name"
                  placeholder="Nome completo" required formControlName="name" class="form-control" />
                <label class="form-label pergunta" for="name">Nome do usuário</label>
              </div>
            </div>

            <div class="form-group col-sm-2 col-12 ">
              <div class="form-floating">
                <input type="text" id="user_name" name="user_name"
                  placeholder="Nome completo" required formControlName="user_name" class="form-control" />
                <label class="form-label pergunta" for="user_name">Nick Name</label>
              </div>
            </div>

            <div class="form-group col-sm-4 col-12 ">
              <div class="form-floating">
                <input type="text" id="user_email" name="user_email"
                  placeholder="Digite o email" required formControlName="user_email" class="form-control" />
                <label class="form-label pergunta" for="user_email">Email</label>
              </div>
            </div>

            <div class="form-floating col-sm-2 col-12 mb-2">
              <select name="profile_id" id="profile_id" class="form-select text-capitalize" formControlName="profile_id" required>
                <option value='1'> Admin </option>
                <option value='2'> Secretário </option>
                <option value='3'> Coordenador </option>
                <option value='4'> Colaborador </option>
                <option value='5'> Parceiro </option>
              </select>
              <label class="form-label pergunta ms-3" for="mes">Perfil do usuário</label>
            </div>

          </div>
          <div class="row mt-4 mb-4">

            <div class="form-floating col-sm-6 col-12 mb-2">
              <select name="coord_id" id="coord_id" class="form-select text-capitalize" formControlName="coord_id" required>
                <option value="" disabled selected>Coordenadoria</option>
                <option *ngFor="let coord of lista_coordenadoria" [value]="coord.id">{{ coord.coordenadoria }}</option>
              </select>
              <label class="form-label pergunta ms-3" for="mes">Coordenadoria</label>
            </div>

            <div class="form-floating col-sm-6 col-12 mb-2">
              <select name="sexec_id" id="sexec_id" class="form-select text-capitalize" formControlName="sexec_id" required>
                <option value="" disabled selected>Secretaria Executiva</option>
                <option *ngFor="let sexec of lista_secretaria" [value]="sexec.id">{{ sexec.secretaria }}</option>
              </select>
              <label class="form-label pergunta ms-3" for="mes">Secretaria Executiva</label>
            </div>

          </div>
          <div class="row">
            <div class="col-sm-2 col-12 mb-2">
              <div class="form-check form-check-inline">
                <label class="form-check-label" for="user_active">Usuário Ativo</label>
                <input class="form-check-input" type="checkbox" id="user_active" formControlName="user_active" name="user_active" value=true>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" id="cancel" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" (click)="updateUser()" class="btn btn-warning">Update</button>
      </div>
    </div>
  </div>
</div>
