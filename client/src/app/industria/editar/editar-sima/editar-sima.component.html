    </div>
    <div class="card-body table-card">
      <h2 class="text-center text-uppercase text-white mb-3 pt-4 pb-4">SIMA</h2>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th scope="col" class="align-middle text-center">Número do Programa</th>
              <th scope="col" class="align-middle text-center">Nome da Entrega</th>
              <th scope="col" class="align-middle text-center">Status</th>
              <th scope="col" class="align-middle text-center">Responsável</th>
              <th scope="col" class="align-middle text-center" colspan="2">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let sima of lista_sima | paginate: { itemsPerPage: itemsPerPage, currentPage: page }">
              <td scope="row" class="align-middle text-center">{{ sima.numero_programa }}</td>
              <td class="align-middle text-center">{{ sima.nome_entrega }}</td>
              <td class="align-middle text-center">{{ sima.ass_sima_status.name }}</td>
              <td class="align-middle text-center">{{ sima.ass_sima_users.name }}</td>

              <td class="align-middle text-center">
                <button title="Editar Empresas" type="button" class="btn btn-primary mx-3" (click)="editSima(sima)"
                  data-bs-toggle="modal" data-bs-target="#editSima"><i class="bi bi-pencil-square"></i></button>
              </td>

              <td *ngIf="profile_id === 1 || profile_id === 2 || profile_id === 3" class="text-center">
                <button title="Deletar Empresas" class="btn btn-danger" (click)="deleteSima(sima)" type="button">
                  <i class="bi bi-trash-fill"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
        <pagination-controls class="text-center" (pageChange)="page = $event"></pagination-controls>
      </div>
    </div>
  </div>

</div>

<!--Modal Empresa e Atração-->
<div class="modal fade" id="editSima" tabindex="-1" aria-labelledby="editSimaLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable mt-5">
    <div class="modal-content">
      <div class="modal-header text-bg-success">
        <h1 class="modal-title fs-5 text-uppercase" id="editSimaLabel">SIMA</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="container">
          <form [formGroup]="formSima">
            <fieldset>

              <div class="row mt-4 mb-4">
                <div class="form-group col-sm-4 col-12">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="numero_programa" placeholder="Digite o CNPJ da Empresa"
                      name="numero_programa" formControlName="numero_programa" required>
                    <label for="numero_programa" class="form-label pergunta">Número do Programa</label>
                  </div>
                </div>

                <div class="form-group col-sm-4 col-12">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="nome_entrega" placeholder="Nome da Entrega"
                      name="nome_entrega" formControlName="nome_entrega" required>
                    <label for="nome_entrega" class="form-label pergunta">Nome da Entrega</label>
                  </div>
                </div>

                <div class="form-floating col-sm-4 col-12">
                  <select name="responsavel_id" id="responsavel_id" class="form-select"
                    formControlName="responsavel_id">
                    <option *ngFor="let resp of lista_users" [value]="resp.id">{{ resp.name }}</option>
                  </select>
                  <label class="form-label pergunta ms-3" for="responsavel_id">Responsável</label>

                </div>

              </div>
              <div class="row mt-4 mb-4">
                <div class="form-group col-sm-4 col-12">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="meta" placeholder="Digite a razão social da Empresa"
                      name="meta" formControlName="meta" required>
                    <label for="meta" class="form-label pergunta">Meta</label>
                  </div>
                </div>

                <div class="form-group col-sm-4 col-12">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="mapp" name="mapp" formControlName="mapp">
                    <label for="mapp" class="form-label pergunta">Mapp</label>
                  </div>
                </div>

                <div class="form-floating col-sm-4 col-12">
                  <select name="status_id" id="status_id" class="form-select" formControlName="status_id">
                    <option *ngFor="let status of lista_status" [value]="status.id">{{ status.name }}</option>
                  </select>
                  <label class="form-label pergunta ms-3" for="status_id">Status</label>

                </div>

              </div>

              <div class="row mt-4 mb-4">
                <div class="form-group col-12">
                  <div class="form-outline">
                    <div class="form-floating">
                      <textarea class="form-control" id="detalhamento" [maxlength]="maxChars"
                        formControlName="detalhamento" name="detalhamento" style="height: 100px"></textarea>
                      <label for="floatingTextarea2">Detalhamento</label>

                    </div>
                  </div>
                </div>
              </div>

            </fieldset>


          </form>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" id="cancel" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" (click)="updateSima()" class="btn btn-warning">Update</button>

      </div>
    </div>
  </div>
</div>
